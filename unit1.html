<style>

<script>
(function(){
'use strict';
var KEY='happyday-g3u1-v1';
var S=load();
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');o.stars=o.stars||{};if(o.sound===undefined)o.sound=true;o.sec=o.sec||{};o.best=o.best||{};return o}catch(e){return{stars:{},sound:true,sec:{}}}}

var total=parts.words+parts.listen+parts.pics+parts.time+parts.gram;return{parts:parts,total:total,goal:GOAL}}

return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100" role="img" aria-label="clock"><circle cx="50" cy="50" r="46" fill="#fffdf4" stroke="#e0a800" stroke-width="5"/><text x="50" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#241540">12</text><text x="86" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#241540">3</text><text x="50" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#241540">6</text><text x="14" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#241540">9</text>'+hand(ha,26,5)+hand(ma,38,3.4)+'<circle cx="50" cy="50" r="3.4" fill="#e0a800"/></svg>'}

// ---- word studio
function studio(){var d=el('<div></div>');d.appendChild(backBtn(home));d.appendChild(el('<h2 style="margin-bottom:2px">☀️ Words</h2>'));d.appendChild(el('<div class="ar" lang="ar" dir="rtl" style="font-size:22px">كلمات الوحدة الأولى: تعلّم، استمع، ثم العب.</div>'));

function extraWords(){var d=el('<div></div>');var bk=el('<button class="back">← Words</button>');bk.onclick=studio;d.appendChild(bk);d.appendChild(el('<h2 style="margin-bottom:2px">More words</h2>'));d.appendChild(el('<div class="ar" lang="ar" dir="rtl" style="font-size:20px">كلمات إضافية من قصص وقراءات الوحدة الأولى</div>'));d.appendChild(el('<p class="sm">Extra words from the Unit 1 stories and reading pages. Read them with the Class Book and Activity Book. Tap the speaker to listen. This list has no points.</p>'));var t=el('<div class="card" style="padding:6px 14px"></div>');XW.forEach(function(w,i){var id='xw'+(i<9?'0':'')+(i+1);var r=el('<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e3eef2"><div style="min-width:0;overflow-wrap:anywhere"><div style="font-size:28px;font-weight:800;color:#14424f;line-height:1.2">'+esc(w[0])+'</div><div lang="ar" dir="rtl" style="font-size:22px;color:#3d5a66;text-align:left;margin-top:2px">'+w[1]+'</div></div><span class="xb2"></span></div>');if(has(id)){var b=spk(id,'Listen');b.style.margin='0';b.style.flexShrink='0';r.querySelector('.xb2').appendChild(b)}t.appendChild(r)});d.appendChild(t);show(d)}

if(selL.en===w.en){good();b.disabled=true;lb.disabled=true;b.classList.add('ok');lb.classList.add('ok');b.innerHTML='&#10003; '+w.ar;lb.innerHTML='&#10003; '+esc(w.en);matched++;selL=null;lb.classList.remove('sel');msg.innerHTML='<b style="color:#1f9d63">Correct!</b>';

else{bad();if(missed.indexOf(selL)<0)missed.push(selL);b.classList.add('no');setTimeout(function(){b.classList.remove('no')},500);msg.innerHTML='<b style="color:#d9433a">&#10007; Not this one. Try again.</b>'}};cr.appendChild(b)});
d.appendChild(cols);d.appendChild(msg);show(d);

if(!retry&&si<sets.length){setup(sets[si],false)}else if(missed.length&&round<2){round++;var m=missed;missed=[];setup(m.length>1?m:m.concat(s.words.filter(function(x){return m.indexOf(x)<0}).slice(0,1)),true)}else{var was=S.sec[s.id];S.sec[s.id]=1;save();rate('sec_'+s.id,2);var e=el('<div class="card center"><div class="big" style="color:#f6b81a">&#9733;</div><h2>Section done!</h2><p>'+esc(s.en)+'</p><p style="font-weight:800;color:#14424f">'+(!was?'+8 new points! ':'')+'Points: '+pointsInfo().total+' / '+GOAL+'</p></div>');var b=el('<button class="btn">Back to the words</button>');b.onclick=studio;e.appendChild(b);var w=el('<div></div>');w.appendChild(e);show(w)}};d.appendChild(nx);nx.scrollIntoView&&nx.scrollIntoView({block:'center'})}
}

// ---- generic quiz runner
function quiz(id,title,ar,items,autoplay){
var i=0,firstTry=0;
function render(){
var it=items[i];var d=el('<div></div>');d.appendChild(backBtn(home));
d.appendChild(el('<h2>'+title+'</h2>'));d.appendChild(el('<div class="ar" lang="ar" dir="rtl">'+ar+'</div>'));
d.appendChild(el('<div class="prog"><i style="width:'+Math.round(i/items.length*100)+'%"></i></div>'));

if(has(it.pre)){var sb=el('<button class="btn alt" style="margin:6px 0;font-size:20px">'+SPK+' Listen</button>');sb.onclick=function(){play(it.pre)};c.appendChild(sb);if(autoplay)setTimeout(function(){play(it.pre)},300)}
var tried=false,done=false,hintBox=el('<div></div>');
var opts=shuffle(it.opts.map(function(o,idx){return{o:o,ok:idx===it.a}}));
opts.forEach(function(op){var b=el('<button class="opt">'+esc(op.o)+'</button>');b.onclick=function(){
if(done)return;
if(op.ok){done=true;b.classList.add('right');good();if(!tried)firstTry++;
Array.prototype.forEach.call(c.querySelectorAll('.opt'),function(x){x.disabled=true});
hintBox.innerHTML='<div class="hint"><b style="color:#1f9d63">&#10003;</b> '+(it.ok||'Correct!')+'</div>';
if(has(it.aud)){play(it.aud);var la=el('<button class="btn alt" style="margin-top:6px">'+SPK+' Listen again</button>');la.onclick=function(){play(it.aud)};hintBox.appendChild(la)}
var nx=el('<button class="btn gold" style="margin-top:8px">'+(i+1<items.length?'Next →':'Finish')+'</button>');
nx.onclick=function(){i++;if(i<items.length)render();else end()};hintBox.appendChild(nx)}
else{tried=true;b.classList.add('wrong');b.disabled=true;bad();hintBox.innerHTML='<div class="hint">Try again. Hint: '+esc(it.hint||'Look and listen again.')+'</div>'}};c.appendChild(b)});
c.appendChild(hintBox);d.appendChild(c);show(d)}
function end(){var pct=firstTry/items.length,n=pct>=.85?3:pct>=.6?2:1;rate(id,n);S.best=S.best||{};var prev=S.best[id]||0;if(firstTry>prev){S.best[id]=firstTry;save()}var gained=(firstTry-prev)*2;
var d=el('<div class="card center"><div class="big">&#9733;</div><h2>'+firstTry+' / '+items.length+' on the first try</h2><div style="font-size:30px;color:#f6b81a">'+stars(n)+'</div><p>'+(n===3?'Fantastic!':'Good work! Try again for more stars.')+'</p><p style="font-weight:800;color:#14424f">'+(gained>0?'+'+gained+' new points! ':'')+'Points: '+pointsInfo().total+' / '+GOAL+'</p></div>');
var b=el('<button class="btn">Back home</button>');b.onclick=home;d.appendChild(b);
var r=el('<button class="btn alt" style="margin:8px">Play again</button>');r.onclick=function(){go(id)};d.appendChild(r);
var w=el('<div></div>');w.appendChild(d);show(w)}
render()}

return{html:'<p style="font-size:20px"><b>Listen, then choose the word you hear.</b></p>',opts:[w.en].concat(others),a:0,hint:'Listen one more time, then choose.',pre:w.aud,aud:w.sent}});
