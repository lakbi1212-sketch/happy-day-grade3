// vocabulary pool: book words (picture) + new words (emoji)
var POOL=[];(window.SEC||[]).forEach(function(s){(s.words||[]).forEach(function(w){if(w.img&&IMG[w.img]&&AUD[w.aud]&&!w.clock)POOL.push({en:w.en,ar:w.ar,aud:w.aud,img:w.img,sent:w.sent})})});

NS.forEach(function(s){SENT.push({en:s.en,id:s.id,ar:s.ar,nw:1})});

$('#menu').innerHTML=GAMES.map(function(g,i){return '<button class="g1 m'+i+(i==6?' wide':'')+'" data-g="'+g[0]+'"><i>'+g[1]+'</i><b>'+g[2]+'</b><small>'+g[3]+'</small></button>'}).join('');
paintPts();$('#cardBtn').onclick=showCard;$('#rstPts').onclick=function(){if(confirm('هل تريد مسح النقاط والبدء من جديد؟')){if(window.G3PTS)G3PTS.resetAll();ST.pts=0;try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}paintPts()}};$('#menu').onclick=function(e){var b=e.target.closest('.g1');if(b)start(b.dataset.g)};
var P=$('#panel');function show(h){P.innerHTML=h;P.classList.add('on');P.scrollIntoView({behavior:'smooth',block:'start'})}
function endScreen(n,max,txt){var st=n>=max*.9?3:n>=max*.6?2:1;ST.stars+=Math.max(1,Math.round(n/max*5));ST.done++;save();confetti();show('<div class="end"><div class="stars">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div><h2>'+n+' / '+max+'</h2><p style="font-size:19px;font-weight:700">'+(st==3?'ما شاء الله! أنت بطل 🌟':st==2?'جميل جدًا! 💪':'أحسنت! جرّب مرة ثانية 🌈')+'</p><div class="row"><button class="btn alt" id="again">مرة أخرى 🔁</button><button class="btn" id="men">القائمة</button></div></div>');$('#again').onclick=function(){start(txt)};$('#men').onclick=function(){P.classList.remove('on');window.scrollTo({top:0,behavior:'smooth'})};if(AUD['g3n_p2'])play('g3n_p2')}
function start(g){({mem:mem,spell:spell,sent:sentGame,hear:hear,cards:cards,sents:sents,seq:seq})[g](g)}
var DECK=[];function pickWords(n,needAud){var p=POOL.filter(function(w){return !needAud||AUD[w.aud]});var out=[],used={};var guard=0;while(out.length<n&&out.length<p.length&&guard++<500){if(!DECK.length){var last=out.map(function(w){return w.en});DECK=shuf(p).filter(function(w){return DECK.indexOf(w)<0});var a=DECK.filter(function(w){return last.indexOf(w.en)<0}),b=DECK.filter(function(w){return last.indexOf(w.en)>=0});DECK=a.concat(b)}var w=DECK.shift();if(!used[w.en]&&(!needAud||AUD[w.aud])){used[w.en]=1;out.push(w)}}return out}
// 1 memory
function mem(g){var ws=pickWords(6,false);var cards=[];ws.forEach(function(w,i){cards.push({k:i,t:'v',w:w});cards.push({k:i,t:'t',w:w})});cards=shuf(cards);var open=[],found=0,tries=0,lock=false;
 show('<div class="ptitle">🧠 اقلب البطاقات وطابق الصورة بالكلمة</div><div class="mem" id="mg">'+cards.map(function(c,i){return '<button class="mc" data-i="'+i+'">❓</button>'}).join('')+'</div><div class="fb" id="fb"></div>');
 $('#mg').onclick=function(e){var b=e.target.closest('.mc');if(!b||lock||b.classList.contains('up')||b.classList.contains('done'))return;var c=cards[+b.dataset.i];b.classList.add('up');b.innerHTML=c.t==='v'?vis(c.w):esc(c.w.en);play(c.w.aud);open.push({b:b,c:c});
  if(open.length==2){tries++;lock=true;var a=open[0],d=open[1];if(a.c.k===d.c.k&&a.c.t!==d.c.t){setTimeout(function(){a.b.className='mc done';d.b.className='mc done';found++;open=[];lock=false;cheer(true);if(found==6){var sc=Math.max(1,Math.round(12/Math.max(tries,6)*6));endScreen(Math.min(6,sc),6,g)}},700)}else{setTimeout(function(){[a,d].forEach(function(x){x.b.className='mc';x.b.textContent='❓'});open=[];lock=false},1000)}}}}
// 2 spell
function spell(g){var ws=shuf(POOL.filter(function(w){return /^[a-z]{3,8}$/i.test(w.en)})).slice(0,8),i=0,ok=0;
 function q(){var w=ws[i];if(!w)return endScreen(ok,ws.length,g);var letters=w.en.split('');var pick=[];
  show('<div class="prog"><i style="width:'+(i/ws.length*100)+'%"></i></div><div class="ptitle">🔤 رتّب الحروف لتكوّن الكلمة</div><div class="big">'+vis(w)+'</div><div class="say"><button class="btn alt" id="sp">🔊 اسمع</button></div><div class="slot" id="slot"></div><div class="bank" id="bank">'+shuf(letters.map(function(l,k){return {l:l,k:k}})).map(function(o){return '<button class="tk l" data-k="'+o.k+'" data-l="'+o.l+'">'+o.l+'</button>'}).join('')+'</div><div class="fb" id="fb"></div><div class="row"><button class="btn r" id="clr">مسح</button></div>');
  play(w.aud);$('#sp').onclick=function(){play(w.aud)};var locked=false;
  function draw(){$('#slot').innerHTML=pick.map(function(p,j){return '<button class="tk l" data-j="'+j+'">'+p.l+'</button>'}).join('');if(pick.length==letters.length){locked=true;var got=pick.map(function(p){return p.l}).join('');var good=got.toLowerCase()===w.en.toLowerCase();var fb=$('#fb');if(good){ok++;fb.className='fb ok';fb.textContent='أحسنت! ⭐ '+w.en;cheer(true)}else{fb.className='fb no';fb.innerHTML='قريب! الكلمة: <span style="direction:ltr;display:inline-block">'+w.en+'</span>';cheer(false)}setTimeout(function(){i++;q()},1500)}}
  $('#bank').onclick=function(e){var b=e.target.closest('.tk');if(!b||b.disabled||locked)return;b.disabled=true;pick.push({l:b.dataset.l,k:b.dataset.k});draw()};
  $('#slot').onclick=function(e){var b=e.target.closest('.tk');if(!b||locked)return;var p=pick.splice(+b.dataset.j,1)[0];var bb=document.querySelector('#bank [data-k="'+p.k+'"]');if(bb)bb.disabled=false;draw()};
  $('#clr').onclick=function(){if(!locked)q()}}q()}

function sentGame(g){var ss=shuf(SENT.filter(function(s){var n=s.en.split(' ').length;return n>=3&&n<=8&&AUD[s.id]})).slice(0,8),i=0,ok=0;
 function q(){var s=ss[i];if(!s)return endScreen(ok,ss.length,g);var ws=s.en.split(' ');var pick=[];
  show('<div class="prog"><i style="width:'+(i/ss.length*100)+'%"></i></div><div class="ptitle">🧩 رتّب الكلمات لتكوّن الجملة</div><div class="say"><button class="btn alt" id="sp">🔊 اسمع الجملة</button></div>'+(s.ar?'<div style="text-align:center;font-size:17px;color:#4b4268;margin-bottom:6px">'+s.ar+'</div>':'')+'<div class="slot" id="slot"></div><div class="bank" id="bank">'+shuf(ws.map(function(w,k){return {w:w,k:k}})).map(function(o){return '<button class="tk" data-k="'+o.k+'" data-w="'+esc(o.w)+'">'+esc(o.w)+'</button>'}).join('')+'</div><div class="fb" id="fb"></div><div class="row"><button class="btn r" id="clr">مسح</button></div>');

  $('#slot').onclick=function(e){var b=e.target.closest('.tk');if(!b||locked)return;var p=pick.splice(+b.dataset.j,1)[0];var bb=document.querySelector('#bank [data-k="'+p.k+'"]');if(bb)bb.disabled=false;draw()};

 function q(){var w=ws[i];if(!w)return endScreen(ok,ws.length,g);var o=shuf([w].concat(shuf(POOL.filter(function(x){return x.en!==w.en})).slice(0,2)));var lock=false;

var DAY=[['get up','🛏️',0],['pray','🤲',1],['have breakfast','🍳',2],['go to school','🏫',3],['have lunch','🍽️',4],['do homework','📝',5],['have dinner','🍲',6],['go to bed','😴',7]];
function seq(g){var items=DAY.slice(0,8),want=0,ok=0,miss=0;
 function draw(){show('<div class="prog"><i style="width:'+(want/items.length*100)+'%"></i></div><div class="ptitle">🌞 اضغط الأنشطة بالترتيب من الصباح إلى الليل</div><div class="opts w" id="o">'+shuf(items).map(function(x){var done=x[2]<want;return '<button class="op" data-n="'+x[2]+'" '+(done?'disabled style="opacity:.35"':'')+'><span class="em" style="font-size:34px;margin-inline-end:10px">'+x[1]+'</span>'+x[0]+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>');
